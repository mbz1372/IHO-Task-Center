<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پیش‌نمایش میز کار تأمین ایران‌هتل</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#17243d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102b54;color:white;padding:20px 28px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}main{max-width:1250px;margin:auto;padding:25px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs button,button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font:inherit;background:#e9eff8;color:#142744}.tabs button.active,.primary{background:#1266cc;color:white}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:20px}.metric strong{font-size:29px;display:block;margin-top:8px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:25px 0 12px;flex-wrap:wrap}.toolbar input,select,input{padding:12px;border:1px solid #d8e1ed;border-radius:9px;font:inherit;max-width:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.task{background:white;border:1px solid #e1e7f0;border-radius:14px;padding:17px;display:grid;gap:12px}.task small,.muted{color:#68778d}.tag{display:inline-block;border-radius:7px;background:#fff2d4;color:#886009;padding:5px 9px;font-size:12px}.task footer{display:flex;justify-content:space-between;align-items:center}button:focus,input:focus{outline:2px solid #478ee5}#form{display:none;position:fixed;inset:0;background:#001a3b89;place-items:center;padding:18px}#form.open{display:grid}.dialog{background:white;border-radius:18px;padding:26px;width:min(480px,100%);display:grid;gap:12px}.dialog input,.dialog select{width:100%}.empty{background:white;padding:35px;text-align:center;border-radius:14px}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}header{padding:15px}main{padding:12px}}
</style></head><body>
<header><b>ایران‌هتل | میز کار زنجیره تأمین</b><span>نمونه UX مستقل • بدون اتصال به سرور</span></header>
<main><h1>امروز چه کاری باید انجام دهیم؟</h1><p class="muted">از هتل شروع کن، کار مشخص تعیین کن و نتیجه را ثبت کن.</p>
<div class="metrics" id="metrics"></div>
<nav class="tabs" id="tabs"><button data-filter="all" class="active">همه کارها</button><button data-filter="open">نیازمند اقدام</button><button data-filter="doing">در حال پیگیری</button><button data-filter="done">انجام‌شده</button></nav>
<div class="toolbar"><div><h2 id="heading">کارهای تیم</h2><span class="muted" id="count"></span></div><div><input id="search" placeholder="جستجوی نام هتل یا کار..."> <button class="primary" id="new">+ ایجاد کار</button></div></div>
<section class="cards" id="cards"></section>
</main>
<div id="form" role="dialog" aria-modal="true"><form class="dialog" id="editor"><h2>ایجاد کار جدید</h2><label>هتل<input name="hotel" required placeholder="نام هتل"></label><label>اقدام<input name="title" required placeholder="مثلاً بررسی مغایرت نرخ"></label><label>مسئول<input name="owner" required placeholder="کارشناس مسئول"></label><label>تاریخ پیگیری<input name="due" type="date" required></label><label>اولویت<select name="priority"><option value="high">فوری</option><option value="medium">عادی</option></select></label><div style="display:flex;gap:8px"><button type="submit" class="primary">ثبت کار</button><button type="button" id="cancel">انصراف</button></div></form></div>
<script>
const $=s=>document.querySelector(s),key='iho-supply-ux-demo-v1';
const sample=[{id:1,hotel:'هتل پردیسان مشهد',title:'بررسی نرخ و ظرفیت آنلاین',owner:'تیم تأمین',due:'',priority:'high',status:'open'},{id:2,hotel:'هتل هما ۲ مشهد',title:'پیگیری نرخ رقابتی',owner:'تیم تأمین',due:'',priority:'medium',status:'doing'}];
let tasks;try{tasks=JSON.parse(localStorage.getItem(key))||sample}catch{tasks=sample}let filter='all';
function save(){localStorage.setItem(key,JSON.stringify(tasks))}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){const counts={all:tasks.length,open:tasks.filter(t=>t.status==='open').length,doing:tasks.filter(t=>t.status==='doing').length,done:tasks.filter(t=>t.status==='done').length};const metric=$('#metrics');metric.replaceChildren();[['کل کارها',counts.all],['نیازمند اقدام',counts.open],['در حال پیگیری',counts.doing],['انجام‌شده',counts.done]].forEach(([a,b])=>{const d=el('div','metric',a);d.append(el('strong','',String(b)));metric.append(d)});
const q=$('#search').value.trim().toLocaleLowerCase('fa');const visible=tasks.filter(t=>(filter==='all'||t.status===filter)&&[t.title,t.hotel,t.owner].join(' ').toLocaleLowerCase('fa').includes(q));$('#count').textContent=visible.length+' کار';const grid=$('#cards');grid.replaceChildren();if(!visible.length){grid.append(el('p','empty','کاری پیدا نشد؛ جستجو را تغییر بده یا کار جدید ثبت کن.'));return}
for(const t of visible){const card=el('article','task'),hotel=el('small','',t.hotel),title=el('strong','',t.title),owner=el('div','muted','مسئول: '+t.owner),badge=el('span','tag',t.priority==='high'?'فوری':'عادی'),footer=el('footer'),sel=el('select');[['open','نیازمند اقدام'],['doing','در حال پیگیری'],['done','انجام‌شده']].forEach(([v,l])=>{const o=el('option','',l);o.value=v;sel.append(o)});sel.value=t.status;sel.addEventListener('change',()=>{t.status=sel.value;save();render()});footer.append(badge,sel);card.append(hotel,title,owner,el('small','','موعد: '+(t.due||'تعیین نشده')),footer);grid.append(card)}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').addEventListener('input',render);$('#new').onclick=()=>$('#form').classList.add('open');$('#cancel').onclick=()=>$('#form').classList.remove('open');$('#editor').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);tasks.unshift({id:Date.now(),hotel:f.get('hotel'),title:f.get('title'),owner:f.get('owner'),due:f.get('due'),priority:f.get('priority'),status:'open'});save();e.target.reset();$('#form').classList.remove('open');filter='all';document.querySelector('[data-filter="all"]').click();render()};render();
</script></body></html>
